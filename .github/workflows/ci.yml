name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  api-docs:
    name: Versioned Node.js and web API documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install documentation tooling without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test:docs
      - run: pnpm ci:docs:releases

  cargo_fmt:
    name: Enforce Rust code format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Check format
        run: cargo +nightly fmt --all -- --check

  main:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: ./.github/actions/install-dependencies
        name: Install dependencies

      # Install chrome + chromedriver for vitest + wasm-pack test
      - name: Install headless Chromium + Chromedriver
        working-directory: ./packages/c2pa-web
        run: pnpm exec playwright install --with-deps

      - name: Cache Trustmark models
        id: cache-trustmark-models
        uses: actions/cache@v4
        with:
          path: packages/c2pa-node/tmp/trustmark_models
          key: trustmark-models-B-v1

      - name: Download Trustmark models
        if: steps.cache-trustmark-models.outputs.cache-hit != 'true'
        run: |
          mkdir -p packages/c2pa-node/tmp/trustmark_models
          BASE="https://cai-watermark.adobe.net/watermarking/trustmark-models"
          curl -fSL "$BASE/encoder_B.onnx" -o packages/c2pa-node/tmp/trustmark_models/encoder_B.onnx
          curl -fSL "$BASE/decoder_B.onnx" -o packages/c2pa-node/tmp/trustmark_models/decoder_B.onnx

      - run: pnpm ci:check
