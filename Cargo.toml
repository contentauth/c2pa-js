
[workspace]
resolver = '2'
members = ['packages/c2pa-wasm', 'packages/c2pa-types', 'packages/c2pa-node']

[workspace.package]
rust-version = "1.96.0"

[workspace.dependencies]
# Testing against the c2pa-rs 0.91.0-rc.3 release candidate tag (not published
# to crates.io). Revert to a crates.io version once 0.91.0 is released.
c2pa = { git = "https://github.com/contentauth/c2pa-rs.git", tag = "c2pa-rc-v0.91.0-rc.3", features = [
    "unstable_builder_filter",
    "pdf",
    "rust_native_crypto",
    "fetch_remote_manifests",
    "json_schema",
    "http_reqwest",
], default-features = false }

[profile.release]
opt-level = "s"
lto = true
